name: Publish Docker image

# Each architecture is built natively (AMD64 on ubuntu-latest, ARM64 on
# GitHub's free ARM runners) in parallel jobs, instead of emulating ARM64
# with QEMU on a single x86 runner. Per-arch images are pushed by digest,
# then merged into multi-arch manifest lists in the publish job. Build
# layers are cached in the GitHub Actions cache (type=gha) so releases
# that don't touch the base layers rebuild quickly.

on:
  push:
    branches:
      - main
    paths:
      - 'src/version.txt'

jobs:
  check-version:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      needs_update: ${{ steps.check_version.outputs.needs_update }}
      version: ${{ steps.check_version.outputs.version }}
      build_matrix: ${{ steps.platforms.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Check if version needs update
        id: check_version
        run: |
          # Read version from src/version.txt file
          new_version=$(cat src/version.txt | tr -d '\n')
          echo "New version from version.txt: $new_version"

          # Get the latest tag
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          latest_version=$(echo $latest_tag | sed 's/v//')
          echo "Latest tag version: $latest_version"

          # Compare versions so stable releases outrank beta/test prereleases
          version_is_newer=$(python3 - "$latest_version" "$new_version" <<'PY'
          import re
          import sys

          def parse_version(value):
              match = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?', value)
              if not match:
                  return None

              major, minor, patch, prerelease = match.groups()
              prerelease_tokens = []
              if prerelease:
                  prerelease_tokens = [
                      (0, int(token)) if token.isdigit() else (1, token)
                      for token in re.findall(r'[A-Za-z]+|\d+', prerelease.lower())
                  ]

              # Stable releases compare higher than prereleases for the same base version.
              return (
                  int(major),
                  int(minor),
                  int(patch),
                  1 if prerelease is None else 0,
                  prerelease_tokens,
              )

          latest = parse_version(sys.argv[1])
          new = parse_version(sys.argv[2])

          if latest is None or new is None:
              print('fallback')
          else:
              print('true' if new > latest else 'false')
          PY
          )

          if [ "$version_is_newer" = "fallback" ]; then
              if [ "$(printf '%s\n' "$latest_version" "$new_version" | sort -V | head -n1)" = "$latest_version" ] && [ "$latest_version" != "$new_version" ]; then
                  version_is_newer=true
              else
                  version_is_newer=false
              fi
          fi

          if [ "$version_is_newer" = "true" ]; then
              echo "needs_update=true" >> $GITHUB_OUTPUT
              echo "version=$new_version" >> $GITHUB_OUTPUT
              echo "📦 New version detected: $new_version (latest tag: $latest_version)"
          else
              echo "needs_update=false" >> $GITHUB_OUTPUT
              echo "✅ No new version to publish (version.txt: $new_version, latest tag: $latest_version)"
          fi

      - name: Create and push tag
        if: steps.check_version.outputs.needs_update == 'true'
        run: |
          git tag ${{ steps.check_version.outputs.version }}
          git push origin ${{ steps.check_version.outputs.version }}

      - name: Determine build matrix
        id: platforms
        run: |
          VERSION="${{ steps.check_version.outputs.version }}"

          # Only build ARM for stable versions (not beta versions). Each
          # platform builds natively on a matching runner (no QEMU).
          if [[ "$VERSION" == *"-beta"* ]]; then
            matrix='{"include":[{"platform":"linux/amd64","runner":"ubuntu-latest"}]}'
            echo "🧪 Beta version detected - building only for AMD64 (no ARM)"
          else
            matrix='{"include":[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]}'
            echo "📦 Stable/test version - building for AMD64 and ARM64"
          fi

          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build:
    needs: check-version
    if: needs.check-version.outputs.needs_update == 'true'

    strategy:
      matrix: ${{ fromJSON(needs.check-version.outputs.build_matrix) }}

    runs-on: ${{ matrix.runner }}

    permissions:
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Poznote image (by digest)
        id: build_default
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ needs.check-version.outputs.version }}
            APP_VERSION=${{ needs.check-version.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/poznote,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=poznote-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=poznote-${{ env.PLATFORM_PAIR }}

      - name: Build and push Poznote rootless image (by digest)
        id: build_rootless
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rootless
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ needs.check-version.outputs.version }}
            APP_VERSION=${{ needs.check-version.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/poznote,push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=poznote-rootless-${{ env.PLATFORM_PAIR }}
            type=gha,scope=poznote-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=poznote-rootless-${{ env.PLATFORM_PAIR }}

      - name: Build and push MCP image (by digest)
        id: build_mcp
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/poznote-mcp,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=poznote-mcp-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=poznote-mcp-${{ env.PLATFORM_PAIR }}

      - name: Export digests
        run: |
          mkdir -p "${{ runner.temp }}/digests/default" "${{ runner.temp }}/digests/rootless" "${{ runner.temp }}/digests/mcp"

          digest="${{ steps.build_default.outputs.digest }}"
          touch "${{ runner.temp }}/digests/default/${digest#sha256:}"

          digest="${{ steps.build_rootless.outputs.digest }}"
          touch "${{ runner.temp }}/digests/rootless/${digest#sha256:}"

          digest="${{ steps.build_mcp.outputs.digest }}"
          touch "${{ runner.temp }}/digests/mcp/${digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [check-version, build]
    if: needs.check-version.outputs.needs_update == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker tags
        id: docker_tags
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          TAGS="ghcr.io/${{ github.repository_owner }}/poznote:$VERSION"

          # Only add semantic version tags and 'latest' for stable versions (not test or beta versions)
          if [[ "$VERSION" != *"-test"* ]] && [[ "$VERSION" != *"-beta"* ]]; then
            # Extract major, minor, and patch version numbers
            if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"

              # Add major version tag (e.g., poznote:4)
              TAGS="$TAGS"$'\n'"ghcr.io/${{ github.repository_owner }}/poznote:$MAJOR"

              # Add major.minor version tag (e.g., poznote:4.1)
              TAGS="$TAGS"$'\n'"ghcr.io/${{ github.repository_owner }}/poznote:$MAJOR.$MINOR"

              echo "📦 Stable version detected - will tag as: $VERSION, $MAJOR, $MAJOR.$MINOR, latest"
            else
              echo "⚠️  Version doesn't match semver pattern, skipping major/minor tags"
            fi

            # Add latest tag
            TAGS="$TAGS"$'\n'"ghcr.io/${{ github.repository_owner }}/poznote:latest"
          else
            echo "🧪 Pre-release version detected (test/beta) - will NOT tag as 'latest' or major/minor versions"
          fi

          # Rootless variant tags, derived from the same list: 'latest' becomes
          # 'rootless', every other tag gets a '-rootless' suffix
          # (e.g. poznote:6.30.5-rootless, poznote:6-rootless, poznote:rootless)
          ROOTLESS_TAGS=$(echo "$TAGS" | sed -E 's/:latest$/:rootless/; t; s/$/-rootless/')

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "rootless_tags<<EOF" >> $GITHUB_OUTPUT
          echo "$ROOTLESS_TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Determine MCP Docker tags
        id: mcp_docker_tags
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          TAGS="ghcr.io/${{ github.repository_owner }}/poznote-mcp:$VERSION"

          # Only add semantic version tags and 'latest' for stable versions
          if [[ "$VERSION" != *"-test"* ]] && [[ "$VERSION" != *"-beta"* ]]; then
            # Extract major, minor, and patch version numbers
            if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"

              # Add major version tag (e.g., poznote-mcp:4)
              TAGS="$TAGS"$'\n'"ghcr.io/${{ github.repository_owner }}/poznote-mcp:$MAJOR"

              # Add major.minor version tag (e.g., poznote-mcp:4.1)
              TAGS="$TAGS"$'\n'"ghcr.io/${{ github.repository_owner }}/poznote-mcp:$MAJOR.$MINOR"

              echo "📦 Stable version detected - will tag MCP as: $VERSION, $MAJOR, $MAJOR.$MINOR, latest"
            else
              echo "⚠️  Version doesn't match semver pattern, skipping major/minor tags"
            fi

            # Add latest tag
            TAGS="$TAGS"$'\n'"ghcr.io/${{ github.repository_owner }}/poznote-mcp:latest"
          else
            echo "🧪 Pre-release version detected (test/beta) - will NOT tag MCP with major/minor or 'latest'"
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create multi-arch manifests
        run: |
          # Merge the per-arch images (pushed by digest in the build jobs)
          # into one manifest list per tag.
          create_manifest() {
            local repo="$1" digest_dir="$2" tags="$3"
            local tag_args="" refs="" f t

            while IFS= read -r t; do
              [ -n "$t" ] && tag_args="$tag_args -t $t"
            done <<< "$tags"

            for f in "${{ runner.temp }}/digests/$digest_dir"/*; do
              refs="$refs $repo@sha256:$(basename "$f")"
            done

            echo "📦 Creating manifest for $repo ($digest_dir):"
            docker buildx imagetools create $tag_args $refs
            docker buildx imagetools inspect "$(echo "$tags" | head -n1)"
          }

          create_manifest "ghcr.io/${{ github.repository_owner }}/poznote" default "${{ steps.docker_tags.outputs.tags }}"
          create_manifest "ghcr.io/${{ github.repository_owner }}/poznote" rootless "${{ steps.docker_tags.outputs.rootless_tags }}"
          create_manifest "ghcr.io/${{ github.repository_owner }}/poznote-mcp" mcp "${{ steps.mcp_docker_tags.outputs.tags }}"

      - name: Create GitHub release
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"

          # Check if this is a test or beta version
          if [[ "$VERSION" == *"-test"* ]] || [[ "$VERSION" == *"-beta"* ]]; then
            PRERELEASE_FLAG="--prerelease"
            echo "📋 Creating pre-release for test/beta version: $VERSION"
          else
            PRERELEASE_FLAG=""
            echo "📦 Creating stable release: $VERSION"
          fi

          RELEASE_NOTES=""

          # Method 1: Try to find PR number in recent commit messages (last 10 commits)
          echo "🔍 Searching for PR in recent commits..."
          PR_NUMBER=$(git log -10 --pretty=%s | grep -oP '(?<=#)\d+(?=\))' | head -1 || echo "")

          # Method 2: If no PR found, try to find PR associated with current commit via GitHub API
          if [ -z "$PR_NUMBER" ]; then
            echo "🔍 Searching for PR via GitHub API..."
            COMMIT_SHA=$(git rev-parse HEAD)
            PR_NUMBER=$(gh pr list --search "$COMMIT_SHA" --state merged --json number --jq '.[0].number' 2>/dev/null || echo "")
          fi

          # If we found a PR number, get the PR description
          if [ -n "$PR_NUMBER" ]; then
            echo "📝 Found PR #$PR_NUMBER, fetching description..."
            PR_BODY=$(gh pr view $PR_NUMBER --json body --jq '.body' 2>/dev/null || echo "")

            if [ -n "$PR_BODY" ]; then
              RELEASE_NOTES="$PR_BODY"
              echo "✅ Using PR #$PR_NUMBER description as release notes"
            else
              echo "⚠️ Could not fetch PR description"
            fi
          else
            echo "⚠️ No PR found in recent history or via API"
          fi

          # Fallback: Default message if no PR description found
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="Automatic release for version $VERSION

          This release was automatically created when a new version was detected in the repository."
            echo "📋 Using default release notes"
          fi

          gh release create $VERSION $PRERELEASE_FLAG \
            --title "Release $VERSION" \
            --notes "$RELEASE_NOTES"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up old Docker images
        run: |
          echo "🧹 Cleaning up old Docker images..."

          # Keep only the most recent Docker image versions. Each release now
          # publishes 2 tagged versions of the poznote package (default +
          # rootless), so 40 versions = ~20 releases.
          KEEP_COUNT=40
          PACKAGE_NAME="poznote"

          # Debug: Get all package versions with their tags for analysis
          echo "🔍 Analyzing all Docker image versions..."
          all_versions_debug=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/user/packages/container/${PACKAGE_NAME}/versions" \
            --jq '.[] | {id: .id, tags: .metadata.container.tags, created_at: .created_at}' \
            2>/dev/null || echo "[]")

          echo "📋 All versions found:"
          echo "$all_versions_debug" | head -20  # Show first 20 for debugging

          # Get all package versions (excluding untagged versions and the
          # floating 'latest'/'rootless' tags, which always point at the
          # current release and must never be deleted)
          versions=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/user/packages/container/${PACKAGE_NAME}/versions" \
            --jq '[.[] | select(.metadata.container.tags | length > 0) | select(.metadata.container.tags | index("latest") == null and index("rootless") == null)] | sort_by(.created_at) | reverse | .[].id' \
            2>/dev/null || echo "")

          if [ -z "$versions" ]; then
            echo "ℹ️  No Docker image versions found or failed to fetch"
            exit 0
          fi

          # Convert to array and count
          versions_array=($versions)
          total_versions=${#versions_array[@]}

          echo "📊 Total Docker image versions: $total_versions"

          if [ "$total_versions" -gt "$KEEP_COUNT" ]; then
            # Calculate how many to delete
            to_delete_count=$((total_versions - KEEP_COUNT))
            echo "🗑️  Deleting $to_delete_count old Docker image versions (keeping $KEEP_COUNT most recent):"

            # Delete the oldest versions (they're at the end of our reversed array)
            for ((i=KEEP_COUNT; i<total_versions; i++)); do
              version_id=${versions_array[$i]}
              echo "  - Deleting Docker image version ID: $version_id"

              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/user/packages/container/${PACKAGE_NAME}/versions/${version_id}" \
                2>/dev/null && echo "    ✅ Deleted version ID: $version_id" || echo "    ⚠️  Failed to delete version ID: $version_id"
            done

            echo "✅ Docker images cleanup completed - kept $KEEP_COUNT most recent versions"
          else
            echo "ℹ️  No Docker images cleanup needed (only $total_versions versions, keeping $KEEP_COUNT)"
          fi

          # Final count with detailed breakdown
          echo ""
          echo "📊 Final analysis:"

          final_versions_tagged=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/user/packages/container/${PACKAGE_NAME}/versions" \
            --jq '[.[] | select(.metadata.container.tags | length > 0) | select(.metadata.container.tags[] != "latest")] | length' \
            2>/dev/null || echo "Unknown")

          final_versions_latest=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/user/packages/container/${PACKAGE_NAME}/versions" \
            --jq '[.[] | select(.metadata.container.tags[]? == "latest")] | length' \
            2>/dev/null || echo "Unknown")

          final_versions_untagged=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/user/packages/container/${PACKAGE_NAME}/versions" \
            --jq '[.[] | select(.metadata.container.tags | length == 0)] | length' \
            2>/dev/null || echo "Unknown")

          final_versions_total=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/user/packages/container/${PACKAGE_NAME}/versions" \
            --jq 'length' \
            2>/dev/null || echo "Unknown")

          echo "  📈 Tagged versions (managed by cleanup): $final_versions_tagged"
          echo "  🏷️  Latest tagged versions: $final_versions_latest"
          echo "  🚫 Untagged versions: $final_versions_untagged"
          echo "  📦 Total versions: $final_versions_total"

          # ------------------------------------------------------------------------------------------------
          # CLEANUP FOR MCP IMAGE (Duplicated logic)
          # ------------------------------------------------------------------------------------------------
          echo ""
          echo "🧹 Cleaning up old Docker images for MCP..."
          KEEP_COUNT=20  # single variant, so 20 versions = ~20 releases
          PACKAGE_NAME="poznote-mcp"

          # Get all package versions (excluding 'latest' tag and untagged versions)
          versions=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/user/packages/container/${PACKAGE_NAME}/versions" \
            --jq '[.[] | select(.metadata.container.tags | length > 0) | select(.metadata.container.tags[] != "latest")] | sort_by(.created_at) | reverse | .[].id' \
            2>/dev/null || echo "")

          if [ -z "$versions" ]; then
            echo "ℹ️  No Docker image versions found for MCP or failed to fetch"
            # Do not exit here to allow workflow to finish cleanly
          else
            # Convert to array and count
            versions_array=($versions)
            total_versions=${#versions_array[@]}

            echo "📊 Total MCP Docker image versions: $total_versions"

            if [ "$total_versions" -gt "$KEEP_COUNT" ]; then
              # Calculate how many to delete
              to_delete_count=$((total_versions - KEEP_COUNT))
              echo "🗑️  Deleting $to_delete_count old MCP Docker image versions (keeping $KEEP_COUNT most recent):"

              # Delete the oldest versions
              for ((i=KEEP_COUNT; i<total_versions; i++)); do
                version_id=${versions_array[$i]}
                echo "  - Deleting MCP Docker image version ID: $version_id"

                gh api \
                  --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "/user/packages/container/${PACKAGE_NAME}/versions/${version_id}" \
                  2>/dev/null && echo "    ✅ Deleted version ID: $version_id" || echo "    ⚠️  Failed to delete version ID: $version_id"
              done

              echo "✅ MCP Docker images cleanup completed"
            else
              echo "ℹ️  No MCP Docker images cleanup needed (only $total_versions versions)"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
