name: CI - Docs

# The README and the pages in docs/ (except API-REST.md) are translated into
# every app language, under docs/: docs/README.fr.md, docs/WEBHOOKS.de.md,
# and so on. tools/docs-i18n.py check fails when a
# translation drifts from its English page in a way that breaks the rendered
# docs: a missing page, a heading added on one side only (the heading anchors
# are mapped by position, so every later link would point to the wrong
# section), a changed code block, image or external link, a broken relative
# link or anchor, a stale language selector.
#
# Rewording English prose does not fail it. Adding or removing a heading, a
# code block, an image or a link does, until the six translations follow:
# update them in the same change, then run
#     python3 tools/docs-i18n.py fix
#     python3 tools/docs-i18n.py check
#
# The script only uses the Python standard library, and ubuntu-latest ships
# Python 3, so there is nothing to install or pin.

on:
  push:
    branches:
      - dev
    paths:
      - '**.md'
      - 'tools/docs-i18n.py'
      - '.github/workflows/ci-docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'tools/docs-i18n.py'
      - '.github/workflows/ci-docs.yml'

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Translated docs match the English pages
        run: python3 tools/docs-i18n.py check
