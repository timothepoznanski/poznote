[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = dynamic
; Simultaneous PHP requests. Short ones (autosave, polls, page loads) never
; fill this; long ones do (AI chat streaming, S3 calls, git sync, large
; uploads), and once every worker is busy the whole instance stops answering.
; Each busy worker weighs about 25-30 MB; idle memory is governed by the
; spare settings below, not by this. Override at container start with the
; POZNOTE_PHP_FPM_MAX_CHILDREN environment variable (applied by init.sh).
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
request_terminate_timeout = 600
