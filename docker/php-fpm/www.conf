[www]
user = www-data
group = www-data
; A unix socket rather than 127.0.0.1:9000: with network_mode: host the
; container's loopback is the host's, so a TCP port would collide with
; anything else on the host using it, and a second Poznote instance would
; silently hand its PHP requests to the first one's workers (and data).
; nginx runs as "nginx", a member of the www-data group.
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
; Simultaneous PHP requests. Short ones (autosave, polls, page loads) never
; fill this; long ones do (AI chat streaming, S3 calls, git sync, large
; uploads), and once every worker is busy the whole instance stops answering.
; Each busy worker weighs about 25-30 MB; idle memory is governed by the
; spare settings below, not by this. Override at container start with the
; POZNOTE_PHP_FPM_MAX_CHILDREN environment variable (applied by init.sh).
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
request_terminate_timeout = 600
