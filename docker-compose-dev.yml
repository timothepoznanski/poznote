services:  
  webserver:       
    build:
      context: .
      dockerfile: Dockerfile
    restart: always      
    env_file: .env
    environment:
      SQLITE_DATABASE: /var/www/html/data/database/poznote.db
    ports:
      - "${HTTP_WEB_PORT}:80"
    volumes:
      - "./src:/var/www/html"
      - "./data:/var/www/html/data"
      - "./docker/nginx/default.conf:/etc/nginx/http.d/default.conf:ro"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=5", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: poznote-mcp:dev
    container_name: poznote-mcp-dev
    restart: always
    environment:
      POZNOTE_API_URL: http://webserver:80/api/v1
      POZNOTE_DEBUG: ${POZNOTE_DEBUG:-false}
      POZNOTE_USER_ID: ${POZNOTE_USER_ID:-1}
      POZNOTE_MCP_AUTH_TOKEN: ${POZNOTE_MCP_AUTH_TOKEN:-}
      # Per-caller authentication, see docs/MCP-SERVER.md (off while the provider is empty)
      POZNOTE_MCP_AUTH_PROVIDER: ${POZNOTE_MCP_AUTH_PROVIDER:-}
      POZNOTE_MCP_AUTH_URL: ${POZNOTE_MCP_AUTH_URL:-}
      POZNOTE_MCP_IDENTITY_MATCH: ${POZNOTE_MCP_IDENTITY_MATCH:-oidc_subject:sub}
      POZNOTE_MCP_AUTH_AUDIENCE: ${POZNOTE_MCP_AUTH_AUDIENCE:-}
      POZNOTE_MCP_AUTH_HEADER: ${POZNOTE_MCP_AUTH_HEADER:-}
      POZNOTE_MCP_AUTH_CLIENT_ID: ${POZNOTE_MCP_AUTH_CLIENT_ID:-}
      POZNOTE_MCP_AUTH_CLIENT_SECRET: ${POZNOTE_MCP_AUTH_CLIENT_SECRET:-}
      POZNOTE_MCP_AUTH_TIMEOUT: ${POZNOTE_MCP_AUTH_TIMEOUT:-}
      POZNOTE_MCP_AUTH_CACHE_TTL: ${POZNOTE_MCP_AUTH_CACHE_TTL:-}
    ports:
      - "127.0.0.1:${POZNOTE_MCP_PORT:-8046}:8045"
    volumes:
      - "./data:/var/www/html/data:ro"
    depends_on:
      - webserver
