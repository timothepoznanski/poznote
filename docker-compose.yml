# Poznote Docker Compose Configuration
# 
# IMPORTANT: When updating Poznote, always follow instruction here https://github.com/timothepoznanski/poznote#update-application

services:
  webserver:
    image: ghcr.io/timothepoznanski/poznote:6
    restart: always
    env_file: .env
    environment:
      SQLITE_DATABASE: /var/www/html/data/database/poznote.db
      # Simultaneous PHP requests (image default 10, see docker/php-fpm/www.conf)
      POZNOTE_PHP_FPM_MAX_CHILDREN: ${POZNOTE_PHP_FPM_MAX_CHILDREN:-}
      # PHP memory limit per request, in MB (image default 512, see docker/php/php.ini)
      POZNOTE_PHP_MEMORY_LIMIT: ${POZNOTE_PHP_MEMORY_LIMIT:-}
      # Port nginx listens on inside the container (image default 80), for network_mode: host
      POZNOTE_LISTEN_PORT: ${POZNOTE_LISTEN_PORT:-}
    ports:
      - "${HTTP_WEB_PORT}:80"
    volumes:
      - "./data:/var/www/html/data"
    healthcheck:
      # Port read from the nginx config rather than POZNOTE_LISTEN_PORT, so an
      # invalid value (ignored by the init script) does not fail the check
      test: ["CMD-SHELL", "port=$$(grep -o 'listen [0-9][0-9]*;' /etc/nginx/http.d/default.conf | head -n 1 | tr -dc 0-9); wget --quiet --tries=1 --timeout=5 -O /dev/null http://127.0.0.1:$${port:-80}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp-server:
    image: ghcr.io/timothepoznanski/poznote-mcp:6
    restart: always
    environment:
      POZNOTE_API_URL: http://webserver:80/api/v1
      POZNOTE_DEBUG: ${POZNOTE_DEBUG:-false}
      POZNOTE_USER_ID: ${POZNOTE_USER_ID:-1}
      POZNOTE_MCP_AUTH_TOKEN: ${POZNOTE_MCP_AUTH_TOKEN:-}
    ports:
      - "127.0.0.1:${POZNOTE_MCP_PORT:-8045}:8045"
    volumes:
      - "./data:/var/www/html/data:ro"
    depends_on:
      - webserver
