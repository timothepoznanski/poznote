  # ==================
  # User Management Endpoints
  # ==================
  /users/profiles:
    get:
      tags: [Users]
      summary: Get available user profiles (public)
      description: |
        Returns a list of active user profiles for login/selection purposes.
        This endpoint does NOT require authentication and is used by the login page.
        Does NOT require X-User-ID header.
      security: []
      responses:
        '200':
          description: List of active user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    username:
                      type: string
                      example: "admin"

  /users/me:
    get:
      tags: [Users]
      summary: Get current authenticated user's profile
      description: Does NOT require X-User-ID header.
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                  first_name:
                    type: string
                    nullable: true
                  last_name:
                    type: string
                    nullable: true
                  display_name:
                    type: string
                  is_admin:
                    type: boolean
    patch:
      tags: [Users]
      summary: Update current user's profile (username, first/last name, email)
      description: >-
        Does NOT require X-User-ID header. Only provided fields are updated.
        A self-set email is stored as unverified: OIDC account matching only
        considers verified (admin-set or provider-synced) emails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  maxLength: 60
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,59}$'
                first_name:
                  type: string
                  maxLength: 100
                last_name:
                  type: string
                  maxLength: 100
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Profile updated
        '400':
          description: Invalid or already-taken username/email, or no valid fields
    delete:
      tags: [Users]
      summary: Delete current user's own account and all its data
      description: >-
        Does NOT require X-User-ID header. Permanently deletes the account,
        including all notes, files and attachments. The username must be
        repeated in the body as confirmation, and password sessions must also
        re-enter the current password (OIDC sessions skip the password check).
        User ID 1 and the last active admin cannot be deleted. On success the
        session is destroyed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_username]
              properties:
                confirm_username:
                  type: string
                  description: Must exactly match the current username
                password:
                  type: string
                  description: Current password (required for non-OIDC sessions)
      responses:
        '200':
          description: Account deleted; response includes a redirect URL for the login page
        '400':
          description: Username confirmation mismatch, missing password, or account cannot be deleted
        '403':
          description: Password is incorrect

  /users/me/password:
    post:
      tags: [Users]
      summary: Change current user's password
      description: Does NOT require X-User-ID header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, confirm_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 4
                confirm_password:
                  type: string
      responses:
        '200':
          description: Password changed
        '400':
          description: Missing fields or passwords do not match
        '401':
          description: Current password is incorrect

  /users/me/password-status:
    get:
      tags: [Users]
      summary: Get current user's password status
      description: |
        Indicates whether the current user has a custom password or is using the .env fallback.
        Does NOT require X-User-ID header.
      responses:
        '200':
          description: Password status

  /users/lookup/{username}:
    get:
      tags: [Users]
      summary: Get user ID by username (admin only)
      description: |
        Converts a username to a user ID. Accessible to administrators only.
        Does NOT require X-User-ID header (since the purpose is to find the ID).
        Used by backup scripts to resolve usernames to IDs.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          description: Username to lookup
          example: "Nina"
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 9
                  username:
                    type: string
                    example: "Nina"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not found"

  /admin/users:
    get:
      tags: [Users]
      summary: List all user profiles (admin only)
      description: |
        Get detailed list of all user profiles with storage statistics.
        Requires admin privileges. Does NOT require X-User-ID header.
        Storage statistics are computed per user, so on instances with many
        users prefer paging with limit/offset.

        There is no default page size: omitting `limit` returns every user,
        as it always has. Clients that reconcile the full account list can
        therefore keep calling this endpoint with no parameters and be sure
        they see every account. Paging engages only when `limit` is passed.

        Rows are ordered by `id` ascending, so `offset` is stable across
        calls and consecutive pages never overlap or skip an account.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: >-
            Page size, clamped to 1-200. Omit to return every user (no paging).
            A value above 200 is clamped; check the `limit` field in the
            response to detect it.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: >-
            Number of users to skip, clamped to >= 0. Ignored unless `limit`
            is also passed.
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Filter on username, email, first or last name.
      responses:
        '200':
          description: >-
            List of users with statistics. `total` is the full matching count,
            not the page size. `limit` and `offset` echo the values actually
            applied after clamping, and are both null when no paging was
            requested (the response then contains every user).
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        username:
                          type: string
                        is_admin:
                          type: boolean
                        active:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        last_login:
                          type: string
                          format: date-time
                          nullable: true
                        storage_bytes:
                          type: integer
                        notes_count:
                          type: integer
                        attachments_count:
                          type: integer
                  total:
                    type: integer
                    description: Total users matching the query, ignoring paging.
                  limit:
                    type: integer
                    nullable: true
                    description: Page size actually applied, or null when no paging was requested.
                  offset:
                    type: integer
                    nullable: true
                    description: Offset actually applied, or null when no paging was requested.
        '403':
          description: Admin access required
    post:
      tags: [Users]
      summary: Create a new user profile (admin only)
      description: |
        Create a new user profile. Requires admin privileges.
        Does NOT require X-User-ID header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  example: "newuser"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  message:
                    type: string
        '400':
          description: Invalid request or username already exists
        '403':
          description: Admin access required

  /admin/users/{id}:
    get:
      tags: [Users]
      summary: Get a specific user profile (admin only)
      description: |
        Get detailed information about a specific user including storage statistics.
        Requires admin privileges. Does NOT require X-User-ID header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                  is_admin:
                    type: boolean
                  active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  last_login:
                    type: string
                    format: date-time
                    nullable: true
                  storage:
                    type: object
                    properties:
                      total:
                        type: integer
                      database:
                        type: integer
                      entries:
                        type: integer
                      attachments:
                        type: integer
                  notes_count:
                    type: integer
                  attachments_count:
                    type: integer
        '404':
          description: User not found
        '403':
          description: Admin access required
    patch:
      tags: [Users]
      summary: Update a user profile (admin only)
      description: |
        Update user profile properties (username, active status, admin status).
        Requires admin privileges. Does NOT require X-User-ID header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "newusername"
                active:
                  type: boolean
                is_admin:
                  type: boolean
      responses:
        '200':
          description: User updated successfully
        '400':
          description: Invalid request
        '403':
          description: Admin access required
        '404':
          description: User not found
    delete:
      tags: [Users]
      summary: Delete a user profile (admin only)
      description: |
        Delete a user profile and everything it owns: its local data (notes,
        folders, tags, attachments) and its objects in the S3 buckets
        (attachments and backup archives). The former delete_data parameter is
        gone; deletion always removes all data.

        Cannot delete your own profile or the last admin.
        Requires admin privileges. Does NOT require X-User-ID header.

        This is immediate and irreversible, so download a complete backup ZIP
        first if the data still matters. The response reports
        s3_objects_deleted, plus s3_error when a bucket could not be reached
        (the account is deleted regardless).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User deleted successfully
        '400':
          description: Cannot delete own profile or last admin
        '403':
          description: Admin access required
        '404':
          description: User not found

  /admin/users/{id}/reset-password:
    post:
      tags: [Users]
      summary: Reset or set a user's password (admin only)
      description: |
        Reset a user's password to the default or set a custom one.
        Requires admin privileges. Does NOT require X-User-ID header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [reset_to_default, set_password]
                  default: reset_to_default
                new_password:
                  type: string
                  minLength: 4
                  description: Required when action is set_password
      responses:
        '200':
          description: Password reset or updated
        '400':
          description: Invalid action or password too short
        '403':
          description: Admin access required
        '404':
          description: User not found

  /admin/users/{id}/password-status:
    get:
      tags: [Users]
      summary: Get a user's password status (admin only)
      description: |
        Indicates whether the user has a custom password or is using the .env fallback.
        Requires admin privileges. Does NOT require X-User-ID header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Password status
        '403':
          description: Admin access required
        '404':
          description: User not found

  /admin/stats:
    get:
      tags: [Users]
      summary: Get system statistics (admin only)
      description: |
        Get aggregated statistics for all users (total storage, notes count, etc.).
        Requires admin privileges. Does NOT require X-User-ID header.
      responses:
        '200':
          description: System statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_users:
                    type: integer
                  active_users:
                    type: integer
                  admin_users:
                    type: integer
                  total_storage_bytes:
                    type: integer
                  total_storage_mb:
                    type: number
                  total_notes:
                    type: integer
                  total_attachments:
                    type: integer
        '403':
          description: Admin access required

  /admin/repair:
    post:
      tags: [Users]
      summary: Repair master database (admin only)
      description: |
        Scan user data directories and rebuild the master database registry.
        This includes rebuilding shared links and discovering orphaned users.
        Requires admin privileges. Does NOT require X-User-ID header.
      responses:
        '200':
          description: Repair completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  stats:
                    type: object
                    properties:
                      users_scanned:
                        type: integer
                      users_added:
                        type: integer
                      links_rebuilt:
                        type: integer
                      errors:
                        type: array
                        items:
                          type: string
        '403':
          description: Admin access required

  # ==================
  # Public Tasks Endpoints (token-based, no Basic Auth)
  # ==================
  /public/tasks:
    post:
      tags: [Public Tasks]
      summary: Add a task to a shared task list
      description: Authenticated with the public share token instead of credentials
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Public share token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: Task text
      responses:
        '200':
          description: Task added
        '403':
          description: Invalid token or share not writable

  /public/tasks/{id}:
    patch:
      tags: [Public Tasks]
      summary: Update a task on a shared note
      description: Authenticated with the public share token instead of credentials
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Task index in the list
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Public share token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                completed:
                  type: boolean
                text:
                  type: string
      responses:
        '200':
          description: Task updated
        '403':
          description: Invalid token or share not writable
    delete:
      tags: [Public Tasks]
      summary: Delete a task from a shared task list
      description: Authenticated with the public share token instead of credentials
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Task index in the list
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Public share token
      responses:
        '200':
          description: Task deleted
        '403':
          description: Invalid token or share not writable
