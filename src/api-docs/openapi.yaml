      responses:
        '200':
          description: Share link created
    patch:
      tags: [Share]
      summary: Update share settings
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                indexable:
                  type: boolean
                password:
                  type: string
                  nullable: true
                  description: New password (empty to remove)
                custom_token:
                  type: string
                access_mode:
                  type: string
                  enum: [read_only, check_only, full]
                  description: Access mode (tasklist notes only)
