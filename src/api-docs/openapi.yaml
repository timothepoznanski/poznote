      responses:
        '200':
          description: Setting value
    put:
      tags: [Settings]
      summary: Set a setting value
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
