              schema:
                type: string
                format: binary
    delete:
      tags: [Attachments]
      summary: Delete an attachment
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            example: '6a296134d3bd0'
      responses:
        '200':
