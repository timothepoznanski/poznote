        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Share status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  share:
                    $ref: '#/components/schemas/ShareInfo'
    post:
      tags: [Share]
      summary: Create or renew share link
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                theme:
                  type: string
                  enum: [light, dark, black]
                indexable:
                  type: boolean
                password:
                  type: string
                custom_token:
                  type: string
