  # ==================
  # Backup Endpoints
  # ==================
  /backups:
    get:
      tags: [Backups]
      summary: List all backups (requires admin credentials and X-User-ID)
      description: |
        Lists all backups for the specified user. Requires admin credentials.
        The X-User-ID header specifies which user's backups to list.
      parameters:
        - name: X-User-ID
          in: header
          required: true
          schema:
            type: integer
          description: ID of the user whose backups to list
          example: 9
      responses:
        '200':
          description: List of backups
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  backups:
                    type: array
                    items:
                      $ref: '#/components/schemas/Backup'
                  total:
                    type: integer
    post:
      tags: [Backups]
      summary: Create a new backup (requires admin credentials and X-User-ID)
      description: |
        Creates a backup for the specified user. Requires admin credentials.
        The X-User-ID header specifies which user's data to backup.

        The archive is the same complete backup as the web UI's "Complete
        Backup": database dump, note files, and every attachment, including
        the ones stored in the S3 bucket when S3 attachment storage is
        configured (they are fetched from the bucket while building the
        archive). If the bucket cannot be read, the request fails instead of
        returning an archive with missing files.
      parameters:
        - name: X-User-ID
          in: header
          required: true
          schema:
            type: integer
          description: ID of the user to backup
          example: 9
      responses:
        '201':
          description: Backup created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  filename:
                    type: string
                  size:
                    type: integer
                  download_url:
                    type: string

  /backups/upload:
    post:
      tags: [Backups]
      summary: Upload a backup ZIP to the server
      description: |
        Uploads a local backup ZIP file to the server's backup directory.
        The file is stored with a standard timestamped name.
        Use the returned `filename` with `POST /backups/{filename}/restore` to restore it.
      parameters:
        - name: X-User-ID
          in: header
          required: true
          schema:
            type: integer
          description: ID of the user who owns this backup
          example: 9
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The backup ZIP file to upload
      responses:
        '201':
          description: Backup uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  filename:
                    type: string
                    example: "poznote_backup_2025-01-05_12-00-00.zip"
                  size:
                    type: integer
                  size_mb:
                    type: number
                  restore_url:
                    type: string
                    example: "/api/v1/backups/poznote_backup_2025-01-05_12-00-00.zip/restore"
                  download_url:
                    type: string
                    example: "/api/v1/backups/poznote_backup_2025-01-05_12-00-00.zip"
        '400':
          description: No valid file uploaded or not a ZIP archive
        '500':
          description: Failed to save the uploaded file

  /backups/{filename}:
    get:
      tags: [Backups]
      summary: Download a backup (requires admin credentials and X-User-ID)
      description: |
        Downloads a backup file. Requires admin credentials.
        The X-User-ID header specifies which user's backup to download.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          example: poznote_backup_2026-02-02_15-30-00.zip
        - name: X-User-ID
          in: header
          required: true
          schema:
            type: integer
          description: ID of the user who owns this backup
          example: 9
      responses:
        '200':
          description: Backup file download
          content:
            application/zip:
              schema:
                type: string
                format: binary
    delete:
      tags: [Backups]
      summary: Delete a backup (requires admin credentials and X-User-ID)
      description: |
        Deletes a backup file. Requires admin credentials.
        The X-User-ID header specifies which user's backup to delete.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          example: poznote_backup_2026-02-02_15-30-00.zip
        - name: X-User-ID
          in: header
          required: true
          schema:
            type: integer
          description: ID of the user who owns this backup
          example: 9
      responses:
        '200':
          description: Backup deleted

  /backups/{filename}/restore:
    post:
      tags: [Backups]
      summary: Restore a backup
      description: |
        Restore a backup file. This will replace all current user data
        (database, notes, and attachments) with the data from the backup.

        When S3 attachment storage is enabled, the restore replaces the
        user's bucket content too, so it refuses archives that do not carry
        every attachment file their metadata references (for example a
        backup made with the "lighter archive" option), and it refuses to
        run while the bucket is unreachable. Nothing is modified when the
        restore is refused.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            example: poznote_backup_2026-02-02_15-30-00.zip
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: Backup restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  details:
                    type: object
        '400':
          description: Invalid backup filename format
        '404':
          description: Backup file not found
        '500':
          description: Failed to restore backup

  # ==================
  # System Endpoints
  # ==================
  /system/version:
