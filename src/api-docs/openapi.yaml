openapi: 3.0.3
info:
  title: Poznote REST API
  version: 2.0.0

servers:
  - url: /api/v1
    description: REST API v1

tags:
  - name: Notes
    description: Notes CRUD operations, locks and utilities
  - name: Snapshots
    description: Note snapshots (daily versions)
  - name: Reminders
    description: Note reminders and notifications
  - name: Tasks
    description: Tasks inside task list notes
  - name: Folders
    description: Folders management
  - name: Trash
    description: Trash management
  - name: Workspaces
    description: Workspaces management
  - name: Tags
    description: Tags listing
  - name: Attachments
    description: File attachments
  - name: Share
    description: Note and folder sharing
  - name: Settings
    description: Application settings
  - name: Backups
    description: Backup and restore
  - name: System
    description: System information and utilities
  - name: Git Sync
    description: Git synchronization (GitHub / Forgejo)
  - name: Users
    description: User profiles management
  - name: Public Tasks
    description: Tasks on publicly shared notes (token-based)
  - name: Export
    description: Export operations (legacy endpoints)

security:
  - BasicAuth: []
  - BearerAuth: []
  - SessionAuth: []

components:
  securitySchemes:
    BasicAuth:
      # Deliberate: Basic Auth is protected by brute-force throttling, HTTPS is required,
      # and deployments can disable it entirely via OIDC_DISABLE_BASIC_AUTH.
      # nosemgrep: yaml.openapi.security.use-of-basic-authentication.use-of-basic-authentication
      type: http
      scheme: basic
      description: HTTP Basic Auth with global username/password. Include X-User-ID header for data endpoints.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC Bearer JWT when OIDC is enabled, or the internal MCP Bearer token. For data endpoints, X-User-ID is optional for the OIDC token-linked profile and required for the internal service token.
    SessionAuth:
      type: apiKey
      in: cookie
      name: POZNOTE_SESSION_8040
  
  parameters:
    UserIdHeader:
      name: X-User-ID
      in: header
      required: true
      schema:
        type: integer
      description: User profile ID to access. Required for Basic Auth and internal service-token data requests. OIDC Bearer JWT requests default to the token-linked profile when omitted. Account-access grants from the web UI do not allow non-admin API credentials to target another profile; use admin credentials or the internal service token for cross-profile API access. Use GET /users/profiles to list available profiles.

  schemas:
    Note:
      type: object
      properties:
        id:
          type: integer
          example: 123
        heading:
          type: string
          example: "My Note Title"
        entrycontent:
          type: string
          example: "# Hello World\n\nThis is my note content."
        tags:
          type: string
          example: "work,important"
        folder:
          type: string
          nullable: true
          example: "Projects"
        workspace:
          type: string
          example: "Personal"
        favorite:
          type: integer
          enum: [0, 1]
        trash:
          type: integer
          enum: [0, 1]
        type:
          type: string
          enum: [note, markdown, tasklist, excalidraw]
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        version:
          type: string
          description: >
            Opaque version token for optimistic concurrency. Returned by
            GET /notes/{id} (also as an ETag header) and by PATCH /notes/{id}.
            Pass it back in the PATCH body as if_version (or as an If-Match
            header) to reject the write with a 409 if the note changed since.
          example: "9b74c9897bac770ffc029102a200c5de"

    Folder:
      type: object
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: "Projects"
        workspace:
          type: string
          example: "Personal"
        parent_id:
          type: integer
          nullable: true
        icon:
          type: string
          nullable: true
          example: "lucide-folder"
        color:
          type: string
          nullable: true
          example: "purple"
          description: Stored card color, a palette id or a custom hex.
        color_hex:
          type: string
          nullable: true
          example: "#a855f7"
          description: >
            Resolved card color. Null when the folder has no color or its
            palette entry was deleted.

    Workspace:
      type: object
      properties:
        name:
          type: string
          example: "Personal"
        note_count:
          type: integer
          example: 42

    Attachment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        note_id:
          type: integer
          example: 123
        filename:
          type: string
          example: "document.pdf"
        original_filename:
          type: string
          example: "My Document.pdf"
        mime_type:
          type: string
          example: "application/pdf"
        size:
          type: integer
          example: 102400
        uploaded_at:
          type: string
          format: date-time

    Backup:
      type: object
      properties:
        filename:
          type: string
          example: "poznote_backup_2025-01-05_12-00-00.zip"
        size:
          type: integer
          example: 1975805
        size_mb:
          type: number
          example: 1.88
        created_at:
          type: string
          format: date-time
        download_url:
          type: string
          example: "/api/v1/backups/poznote_backup_2025-01-05_12-00-00.zip"

    ShareInfo:
      type: object
      properties:
        is_shared:
          type: boolean
        token:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        theme:
          type: string
          enum: [light, dark, black]
        indexable:
          type: boolean
        has_password:
          type: boolean
        access_mode:
          type: string
          enum: [read_only, check_only, full]
        allowed_users:
          type: array
          nullable: true
          items:
            type: integer

    Notification:
      type: object
      description: >
        A triggered reminder. Datetimes are UTC in "YYYY-MM-DD HH:MM:SS" format
        with no timezone suffix, not ISO 8601.
      properties:
        id:
          type: integer
          description: Notification ID, used by /reminders/{id}/read and /reminders/{id}/dismiss.
          example: 12
        note_id:
          type: integer
          description: ID of the note this reminder belongs to.
          example: 42
        type:
          type: string
          example: reminder
        message:
          type: string
          description: Reminder message, falls back to the note heading when none was given.
          example: "Call the client back"
        is_read:
          type: integer
          enum: [0, 1]
        created:
          type: string
          description: UTC, "YYYY-MM-DD HH:MM:SS".
          example: "2026-08-01 12:30:00"
        trigger_at:
          type: string
          description: UTC, "YYYY-MM-DD HH:MM:SS".
          example: "2026-08-10 07:00:00"
        note_heading:
          type: string
          nullable: true
          description: Heading of the linked note, null if the note was deleted or trashed.
          example: "Client X"
        recurrence:
          type: string
          nullable: true
          description: Recurrence of the linked note's reminder, null when it does not repeat.
          example: "1w"

    Task:
      type: object
      description: >
        One task of a task list note. Tasks are stored as a JSON array in the
        note content; these are the normalized fields the API returns.
      properties:
        id:
          type: number
          description: Task identifier, unique inside the note.
          example: 1754820000123.45
        text:
          type: string
          example: Buy milk
        completed:
          type: boolean
        important:
          type: boolean
          description: Sorts the task to the top of its list.
        dueAt:
          type: string
          nullable: true
          description: >
            Local wall-clock due date, "YYYY-MM-DD", or "YYYY-MM-DDTHH:MM" when
            a time is set. No timezone offset.
          example: "2026-09-01T18:30"
        dueReminder:
          type: boolean
          description: Whether a notification is scheduled for the due date.
        dueReminderEmail:
          type: boolean
          description: >
            Whether that reminder also sends an email. Only present once
            configured; defaults to enabled otherwise.
        dueRecurrence:
          type: string
          description: >
            Repeat interval of the reminder, "<count><unit>" with unit
            i/h/d/w/m/y. Only present when set.
          example: "1w"

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Error message"

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true

paths:
  # ==================
  # Notes Endpoints
  # ==================
  /notes:
    get:
      tags: [Notes]
      summary: List notes
      description: Get list of notes with optional filters
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: workspace
          in: query
          schema:
            type: string
          description: Filter by workspace name
        - name: folder
          in: query
          schema:
            type: string
          description: Filter by folder name
        - name: folder_id
          in: query
          schema:
            type: integer
          description: Filter by folder ID
        - name: search
          in: query
          schema:
            type: string
          description: Search in note content
        - name: created_from
          in: query
          schema:
            type: string
            format: date
          description: Filter notes created on or after this date
        - name: created_to
          in: query
          schema:
            type: string
            format: date
          description: Filter notes created on or before this date
        - name: favorite
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: Filter favorites only
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated_desc, created_desc, heading_asc]
          description: Sort order
        - name: get_folders
          in: query
          schema:
            type: boolean
          description: Include folder information
      responses:
        '200':
          description: List of notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  notes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
    post:
      tags: [Notes]
      summary: Create a new note
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                heading:
                  type: string
                  example: "New Note"
                content:
                  type: string
                  example: "Note content here"
                entry:
                  type: string
                  description: Alternative field for content
                workspace:
                  type: string
                  example: "Personal"
                folder_id:
                  type: integer
                  nullable: true
                  description: ID of the folder (optional)
                  example: 12
                folder:
                  type: string
                  description: Target folder name (alternative to folder_id)
                type:
                  type: string
                  enum: [note, markdown, tasklist]
                  default: note
                tags:
                  type: string
                  example: "tag1,tag2"
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: integer
                  message:
                    type: string

  /notes/resolve:
    get:
      tags: [Notes]
      summary: Resolve a note reference
      description: Find a note by title or ID within a workspace
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: reference
          in: query
          required: true
          schema:
            type: string
          description: Note title or ID
        - name: workspace
          in: query
          required: true
          schema:
            type: string
          description: Workspace to search in
      responses:
        '200':
          description: Note found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  note:
                    $ref: '#/components/schemas/Note'

  /notes/search:
    get:
      tags: [Notes]
      summary: Search notes
      description: Search notes by heading or content
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: workspace
          in: query
          schema:
            type: string
          description: Restrict search to a workspace
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Maximum number of results
        - name: created_from
          in: query
          schema:
            type: string
            format: date
          description: Filter notes created on or after this date
        - name: created_to
          in: query
          schema:
            type: string
            format: date
          description: Filter notes created on or before this date
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  notes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'

  /notes/with-attachments:
    get:
      tags: [Notes]
      summary: List notes with attachments
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: workspace
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of notes that have attachments

  /notes/{id}:
    get:
      tags: [Notes]
      summary: Get a specific note
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Note details
          headers:
            ETag:
              schema:
                type: string
              description: Version token, same value as note.version
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  note:
                    $ref: '#/components/schemas/Note'
        '404':
          description: Note not found
    patch:
      tags: [Notes]
      summary: Update a note
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: >
            Version token for optimistic concurrency (alternative to the
            if_version body field). The write is rejected with a 409 if the
            note changed since that version.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                heading:
                  type: string
                content:
                  type: string
                tags:
                  type: string
                folder_id:
                  type: integer
                  nullable: true
                  description: ID of the folder (optional)
                if_version:
                  type: string
                  description: >
                    Version token previously returned by GET or PATCH. When
                    set, the write only succeeds if the note still has that
                    version; otherwise a 409 is returned with the current
                    version and content so the caller can merge and retry.
      responses:
        '200':
          description: Note updated (response includes the new version token)
          headers:
            ETag:
              schema:
                type: string
              description: New version token, same value as note.version
        '409':
          description: Version conflict, the note was modified since if_version
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                  code:
                    type: string
                    example: version_conflict
                  current:
                    type: object
                    properties:
                      version:
                        type: string
                      updated:
                        type: string
                        format: date-time
                      heading:
                        type: string
                      content:
                        type: string
    delete:
      tags: [Notes]
      summary: Delete a note (move to trash)
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: permanent
          in: query
          schema:
            type: boolean
            default: false
          description: Permanently delete instead of moving to trash
      responses:
        '200':
          description: Note deleted

  /notes/{id}/restore:
    post:
      tags: [Notes]
      summary: Restore a note from trash
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Note restored

  /notes/{id}/tags:
    put:
      tags: [Notes]
      summary: Update note tags
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: string
                  example: "tag1,tag2,tag3"
      responses:
        '200':
          description: Tags updated

  /notes/{id}/favorite:
    post:
      tags: [Notes]
      summary: Toggle favorite status
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Favorite status toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  favorite:
                    type: integer
                    enum: [0, 1]

  /notes/{id}/duplicate:
    post:
      tags: [Notes]
      summary: Duplicate a note
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Note duplicated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  new_note_id:
                    type: integer

  /notes/{id}/folder:
    post:
      tags: [Notes]
      summary: Move note to a folder
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_id:
                  type: integer
                  nullable: true
                  description: Target folder ID (0 or null moves to root)
                folder:
                  type: string
                  description: Target folder name (alternative to folder_id)
                workspace:
                  type: string
      responses:
        '200':
          description: Note moved

  /notes/{id}/remove-folder:
    post:
      tags: [Notes]
      summary: Remove note from folder (move to root)
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Note moved to root

  /notes/{id}/beacon:
    post:
      tags: [Notes]
      summary: Emergency save via sendBeacon
      description: Used for saving note content when page is closing
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  type: string
                heading:
                  type: string
      responses:
        '200':
          description: Note saved

  /graph:
    get:
      tags: [Notes]
      summary: Get the note-link graph
      description: >
        Returns the graph used by the graph view: one node per non-trashed note
        (note, markdown and tasklist types) and one edge per link between two
        notes.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: workspace
          in: query
          required: false
          description: Restrict the graph to one workspace.
          schema:
            type: string
      responses:
        '200':
          description: Nodes and edges of the note graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        folder:
                          type: string
                        type:
                          type: string
                        favorite:
                          type: boolean
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: integer
                        target:
                          type: integer

  /notes/{id}/backlinks:
    get:
      tags: [Notes]
      summary: Get backlinks for a note
      description: List all notes that link to this note (HTML links, URL parameters, and wiki-link syntax `[[Note Title]]`)
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of backlinks

  /notes/{id}/icon:
    put:
      tags: [Notes]
      summary: Update note icon
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                icon:
                  type: string
                  example: "lucide-file-text"
                  description: Icon class name (empty string resets to default)
                icon_color:
                  type: string
                  example: "#ff9800"
                  description: Icon color (empty string resets)
      responses:
        '200':
          description: Icon updated

  /notes/{id}/pinned:
    put:
      tags: [Notes]
      summary: Pin or unpin a note
      description: Pins a note so it stays at the top of the note list, or unpins it.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                pinned:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Pinned state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  pinned:
                    type: boolean
        '400':
          description: Invalid note ID, or missing/invalid "pinned" boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Note not found or in trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notes/{id}/kanban-completed:
    post:
      tags: [Notes]
      summary: Set the Kanban completed state of a note
      description: >
        Marks a note as completed on the kanban board, or reopens it. Only the
        completion flag changes: the note content and its updated timestamp are
        left untouched.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Kanban completed state updated
        '400':
          description: Missing or non-boolean "completed" field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Note not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notes/{id}/color:
    put:
      tags: [Notes]
      summary: Update note color
      description: >
        Set the note color used to tint its card. Accepts a palette id from the
        user's note color palette, or a custom `#rrggbb` value. Send an empty
        string to remove the color.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                color:
                  type: string
                  example: "blue"
                  description: >
                    Palette id (e.g. `blue`) or custom hex (e.g. `#8bc34a`).
                    Empty string removes the color.
      responses:
        '200':
          description: Color updated
        '400':
          description: Invalid color value
        '404':
          description: Note not found

  /notes/{id}/create-template:
    post:
      tags: [Notes]
      summary: Create a template from a note
      description: Copies the note into the "Templates" folder of its workspace (created if missing)
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Template created

  /notes/{id}/convert:
    post:
      tags: [Notes]
      summary: Convert note type (Markdown <-> HTML)
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: string
                  enum: [html, markdown]
                  description: Target format
      responses:
        '200':
          description: Note converted
        '400':
          description: Invalid or unsupported conversion

  /notes/{id}/lock:
    get:
      tags: [Notes]
      summary: Get note edit lock status
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Current lock status
    post:
      tags: [Notes]
      summary: Acquire an exclusive edit lock
      description: The editor session can also be sent via the X-Editor-Session-ID header
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [editor_session_id]
              properties:
                editor_session_id:
                  type: string
                  description: Unique ID of the editing session
      responses:
        '200':
          description: Lock acquired
        '409':
          description: Note is locked by another session

  /notes/{id}/lock/heartbeat:
    post:
      tags: [Notes]
      summary: Refresh an existing note edit lock
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [editor_session_id]
              properties:
                editor_session_id:
                  type: string
      responses:
        '200':
          description: Lock refreshed
        '409':
          description: Note is locked by another session

  /notes/{id}/lock/release:
    post:
      tags: [Notes]
      summary: Release a note edit lock
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [editor_session_id]
              properties:
                editor_session_id:
                  type: string
      responses:
        '200':
          description: Lock released (or was not held)

  # ==================
  # Snapshots Endpoints
  # ==================
  /notes/{id}/snapshot:
    post:
      tags: [Snapshots]
      summary: Create a snapshot for a note
      description: Without parameters, creates/updates today's automatic snapshot (one per day)
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: manual
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: If 1, create an additional manual snapshot (alias `force`)
      responses:
        '200':
          description: Snapshot created
    get:
      tags: [Snapshots]
      summary: Get a snapshot for a note
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: snapshot_key
          in: query
          schema:
            type: string
          description: Snapshot key from the list endpoint
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Snapshot date (defaults to today)
      responses:
        '200':
          description: Snapshot content
        '404':
          description: Snapshot not found

  /notes/{id}/snapshots:
    get:
      tags: [Snapshots]
      summary: List available snapshots for a note
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of snapshots

  /notes/{id}/snapshot/restore:
    post:
      tags: [Snapshots]
      summary: Restore a note to a snapshot state
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: snapshot_key
          in: query
          schema:
            type: string
          description: Snapshot key from the list endpoint
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Snapshot date (defaults to today)
      responses:
        '200':
          description: Note restored to snapshot state
        '404':
          description: Snapshot not found

  # ==================
  # Reminders Endpoints
  # ==================
  /tasks:
    get:
      tags: [Tasks]
      summary: List the tasks of every task list note
      description: >
        Aggregates the tasks of all non-trashed tasklist notes, as used by the
        tasks page (list and calendar views).
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: workspace
          in: query
          required: false
          description: Restrict the result to one workspace.
          schema:
            type: string
      responses:
        '200':
          description: Task list notes with their decoded tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  notes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        heading:
                          type: string
                        folder:
                          type: string
                        folder_id:
                          type: integer
                          nullable: true
                        workspace:
                          type: string
                        updated:
                          type: string
                        favorite:
                          type: boolean
                        tasks:
                          type: array
                          items:
                            $ref: '#/components/schemas/Task'

  /notes/{id}/tasks:
    get:
      tags: [Tasks]
      summary: List the tasks of one note
      description: >
        Returns the tasks of a single task list note. Use it to obtain a task
        id before updating or deleting that task.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          description: Note ID of a tasklist note.
          schema:
            type: integer
      responses:
        '200':
          description: The note's tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  note_id:
                    type: integer
                    example: 42
                  heading:
                    type: string
                    example: Groceries
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
        '400':
          description: Invalid note ID, or the note is not a task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Note not found or in trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Tasks]
      summary: Add a task to a note
      description: >
        Appends one task to a task list note, without rewriting the note's
        whole content array. When reminder is true, the matching notification
        is scheduled from due_at automatically.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          description: Note ID of a tasklist note.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  example: Buy milk
                due_at:
                  type: string
                  nullable: true
                  description: >
                    Local wall-clock due date, "YYYY-MM-DD" or
                    "YYYY-MM-DDTHH:MM". Resolved through the user's timezone.
                  example: "2026-09-01T18:30"
                reminder:
                  type: boolean
                  description: >
                    Raise a notification on the due date. Requires due_at.
                    A date without a time reminds at 09:00.
                reminder_email:
                  type: boolean
                  description: Also send an email. Ignored when SMTP is not configured.
                recurrence:
                  type: string
                  nullable: true
                  description: Repeat interval, "<count><unit>" with unit i/h/d/w/m/y.
                  example: "1w"
                important:
                  type: boolean
                completed:
                  type: boolean
      responses:
        '200':
          description: The created task
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  note_id:
                    type: integer
                  task:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Missing text, invalid due_at/recurrence, or not a task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Storage quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Note not found or in trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notes/{id}/tasks/{taskId}:
    patch:
      tags: [Tasks]
      summary: Update one task
      description: >
        Updates a single task; only the provided fields change. Completing a
        task clears its pending reminder, and setting due_at to null clears the
        due date and its reminder.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          description: Note ID of a tasklist note.
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          description: Task id as it appears in the note content, e.g. "1754820000123.45".
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                completed:
                  type: boolean
                important:
                  type: boolean
                due_at:
                  type: string
                  nullable: true
                  description: New due date, or null to clear it.
                reminder:
                  type: boolean
                reminder_email:
                  type: boolean
                recurrence:
                  type: string
                  nullable: true
      responses:
        '200':
          description: The updated task
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  note_id:
                    type: integer
                  task:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Invalid body, due_at or recurrence, or not a task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Note or task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Tasks]
      summary: Delete one task
      description: Removes a task from a task list note, along with its pending reminder.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          description: Note ID of a tasklist note.
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          description: Task id as it appears in the note content.
          schema:
            type: string
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  note_id:
                    type: integer
                  task_id:
                    type: string
        '404':
          description: Note or task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notes/{id}/reminder:
    get:
      tags: [Reminders]
      summary: Get reminder for a note
      description: >
        Returns the reminder set on a note. reminder_at is null when the note
        has no reminder.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          description: Note ID (not a notification ID).
          schema:
            type: integer
      responses:
        '200':
          description: Reminder details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  note_id:
                    type: integer
                    example: 42
                  reminder_at:
                    type: string
                    nullable: true
                    description: UTC, "YYYY-MM-DD HH:MM:SS". Null when no reminder is set.
                    example: "2026-08-10 07:00:00"
                  email_enabled:
                    type: boolean
                  recurrence:
                    type: string
                    nullable: true
                    description: Recurrence code, null when the reminder does not repeat.
                    example: "1w"
        '400':
          description: Invalid note ID (not numeric)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Note not found or in trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Reminders]
      summary: Set a reminder on a note
      description: >
        Sets or replaces the reminder on a note. Any existing non-dismissed
        reminder for that note is removed first, so this endpoint is also how
        you modify a reminder.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          description: Note ID (not a notification ID).
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reminder_at]
              properties:
                reminder_at:
                  type: string
                  format: date-time
                  description: >
                    When to trigger the reminder (ISO 8601). Converted to UTC
                    for storage, so include an explicit offset (for example
                    2026-08-10T09:00:00+02:00) to avoid ambiguity.
                  example: "2026-08-10T09:00:00+02:00"
                message:
                  type: string
                  description: Optional reminder message. Defaults to the note heading.
                  example: "Call the client back"
                email_enabled:
                  type: boolean
                  description: >
                    Also send an email. Silently downgraded to false unless SMTP
                    is configured and the current user has a valid email address,
                    so check email_enabled in the response to know what was applied.
                recurrence:
                  type: string
                  nullable: true
                  pattern: '^[1-9][0-9]{0,2}[ihdwmy]$'
                  description: >
                    Repeat interval as `<count><unit>`, count 1-999, unit
                    i = minutes, h = hours, d = days, w = weeks, m = months,
                    y = years. For example "30i", "1h", "1d", "2w", "3m", "1y".
                    Omit it, or send null or "none", for a one-off reminder;
                    any other value is rejected with a 400.


                    Recurring reminders are re-armed on dismissal, not by a
                    background job: the next occurrence is scheduled when the
                    notification is dismissed via /reminders/{id}/dismiss or
                    /reminders/dismiss-all. A client that never dismisses
                    notifications will never see the reminder repeat.
                  example: "1w"
      responses:
        '200':
          description: Reminder set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  note_id:
                    type: integer
                    example: 42
                  reminder_at:
                    type: string
                    description: The stored trigger time, UTC "YYYY-MM-DD HH:MM:SS".
                    example: "2026-08-10 07:00:00"
                  email_enabled:
                    type: boolean
                    description: Whether email was actually enabled, see the request field.
                  recurrence:
                    type: string
                    nullable: true
                    example: "1w"
        '400':
          description: >
            Invalid note ID, malformed JSON body, missing reminder_at,
            unparseable reminder_at, or invalid recurrence format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Note not found or in trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Reminders]
      summary: Remove a reminder from a note
      description: >
        Clears the reminder and its pending notification. This endpoint does not
        check that the note exists: it returns 200 for an unknown note ID, so the
        response is not proof that a note was found.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          description: Note ID (not a notification ID).
          schema:
            type: integer
      responses:
        '200':
          description: Reminder removed (also returned when the note does not exist)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  note_id:
                    type: integer
                    example: 42
        '400':
          description: Invalid note ID (not numeric)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notes/{id}/task-reminder:
    post:
      tags: [Reminders]
      summary: Set a reminder on one task of a task list
      description: >
        Sets or replaces the reminder of a single task inside a tasklist note.
        Any existing non-dismissed reminder for that task is removed first.
        This materializes the task's dueReminder flag as a scheduled
        notification; the task's own dueAt/dueReminder fields live in the note
        content. Task-level reminders are independent of the note-level
        reminder and are never cleared by it.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          description: Note ID of a tasklist note.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, reminder_at]
              properties:
                task_id:
                  type: string
                  description: Task id as it appears in the note content.
                  example: "1754820000123.45"
                reminder_at:
                  type: string
                  description: ISO datetime. Without an offset it is read as UTC.
                  example: "2026-09-01T16:30:00Z"
                message:
                  type: string
                  description: Notification text. Defaults to the note heading when empty.
                  example: Buy milk
                email_enabled:
                  type: boolean
                  description: Also send an email. Ignored when SMTP is not configured.
                recurrence:
                  type: string
                  nullable: true
                  description: >
                    Repeat interval, "<count><unit>" with unit i/h/d/w/m/y.
                    Dismissing the notification schedules the next occurrence
                    and advances the task's due date by the same interval.
                  example: "1w"
      responses:
        '200':
          description: Task reminder scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  note_id:
                    type: integer
                    example: 42
                  task_id:
                    type: string
                    example: "1754820000123.45"
                  reminder_at:
                    type: string
                    description: UTC, "YYYY-MM-DD HH:MM:SS".
                    example: "2026-09-01 16:30:00"
                  email_enabled:
                    type: boolean
                  recurrence:
                    type: string
                    nullable: true
                    example: "1w"
        '400':
          description: Missing task_id/reminder_at, or invalid datetime or recurrence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Note not found or in trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Reminders]
      summary: Remove the reminder of one task
      description: >
        Removes the pending reminder of a single task. task_id can be sent in
        the JSON body or as a query parameter.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          description: Note ID of a tasklist note.
          schema:
            type: integer
        - name: task_id
          in: query
          required: false
          description: Task id, when not sent in the body.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id:
                  type: string
                  example: "1754820000123.45"
      responses:
        '200':
          description: Task reminder removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  note_id:
                    type: integer
                  task_id:
                    type: string
        '400':
          description: Invalid note ID, or missing task_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reminders:
    get:
      tags: [Reminders]
      summary: List triggered notifications
      description: >
        Lists reminders that are already due (trigger_at <= now) and not
        dismissed, newest first, capped at 50. Reminders scheduled in the future
        are not returned.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: workspace
          in: query
          description: Restrict to notifications whose note belongs to this workspace.
          schema:
            type: string
      responses:
        '200':
          description: Notifications with unread/total counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  notifications:
                    type: array
                    description: Due, non-dismissed notifications, newest first, max 50.
                    items:
                      $ref: '#/components/schemas/Notification'
                  unread_count:
                    type: integer
                    description: Due, non-dismissed notifications with is_read = 0. Not capped at 50.
                    example: 1
                  total_count:
                    type: integer
                    description: All due, non-dismissed notifications. Not capped at 50.
                    example: 3
        '500':
          description: Failed to fetch notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reminders/count:
    get:
      tags: [Reminders]
      summary: Get unread notification count (lightweight polling)
      description: >
        Same counters as GET /reminders without the notification list. On an
        internal error this endpoint still returns 200 with both counters at 0
        rather than an error status.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: workspace
          in: query
          description: Restrict to notifications whose note belongs to this workspace.
          schema:
            type: string
      responses:
        '200':
          description: Notification counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  unread_count:
                    type: integer
                    example: 1
                  total_count:
                    type: integer
                    example: 3

  /reminders/dismiss-all:
    post:
      tags: [Reminders]
      summary: Dismiss all notifications
      description: >
        Dismisses every due notification. Recurring reminders are rolled forward
        to their next occurrence; non-recurring ones have their reminder cleared.
        Notifications scheduled in the future are left untouched. The response
        does not report the new occurrence times, read them back with
        GET /notes/{id}/reminder if you need them.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: All due notifications dismissed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '500':
          description: Failed to dismiss all notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reminders/{id}/read:
    post:
      tags: [Reminders]
      summary: Mark a notification as read
      description: >
        Clears the unread flag, which lowers unread_count but leaves the
        notification in the list. Use dismiss to remove it. This endpoint does
        not check that the notification exists.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          description: Notification ID, from GET /reminders (not a note ID).
          schema:
            type: integer
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: integer
                    example: 12
        '400':
          description: Invalid notification ID (not numeric)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reminders/{id}/dismiss:
    post:
      tags: [Reminders]
      summary: Dismiss a notification
      description: >
        Removes the notification from the list. If the linked note has a
        recurrence, this is what schedules the next occurrence and returns it as
        next_reminder_at; otherwise the note's reminder is cleared and
        next_reminder_at is null.
      parameters:
        - $ref: '#/components/parameters/UserIdHeader'
        - name: id
          in: path
          required: true
          description: Notification ID, from GET /reminders (not a note ID).
          schema:
            type: integer
      responses:
        '200':
          description: Notification dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: integer
                    example: 12
                  next_reminder_at:
                    type: string
                    nullable: true
                    description: >
                      Next occurrence for a recurring reminder, UTC
                      "YYYY-MM-DD HH:MM:SS". Null when the reminder does not
                      repeat.
                    example: "2026-08-17 07:00:00"
        '400':
          description: Invalid notification ID (not numeric)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================
  # Share Endpoints
  # ==================
  /notes/{id}/share:
